base_config: node_mlp_v6_fullpart_disk_center.yaml

features:
  include_center_modal_interaction_features: true

scaler:
  cache_path: node/cache/node_mlp_v6_fullpart_disk_center_center_interactions_scalers.pt
  overwrite_cache: true

training:
  init_checkpoint: node/outputs/node_mlp_v6_fullpart_disk_center/best.pt
  allow_partial_init_checkpoint: true
  selection_metric: composite_v6_fullpart_disk_center_center_interactions
  selection:
    mode: weighted_sum
    name: composite_v6_fullpart_disk_center_center_interactions
    components:
      disk_center_stress_top5_miss25_rate: 0.35
      disk_center_stress_top1_miss25_rate: 0.20
      disk_stress_top5_miss25_rate: 0.15
      fullpart_stress_top5_miss25_rate: 0.15
      earpiece_region_stress_top5_miss25_rate: 0.15
  save_dir: node/outputs/node_mlp_v6_fullpart_disk_center_center_interactions

base_config: node_mlp_v6_earpiece_allpoints.yaml

model:
  low_rank_curve_head: true
  curve_rank: 5
  residual_weight: 0.15
  curve_frequency_feature_patterns:
    - earpiece_thickness
    - earpiece_RadialDist
    - earpiece_TopWidth
    - earpiece_HoleTopDist
    - earpiece_TopFilletRadius
    - earpiece_BottomFilletRadius
    - earpiece_HoleRadius
    - earpiece_width_over_plate_radius
    - earpiece_width_over_hole_radius
    - plate_radius
    - Add_mass
    - plate_thickness
    - mass_couple_radius
    - psd_
    - psd_value_at_frequency
    - log_psd_value_at_frequency
    - frequency
    - log_frequency
    - freq_top
    - signed_delta_to_mode
    - abs_delta_to_mode
    - nearest_delta
    - first_mode_ratio
    - freq_ratio_mode_
    - modal_detuning_mode_
    - nearest_freq_ratio
    - nearest_modal_detuning
    - log_modal_amp_
    - modal_weight_
    - nearest_log_modal_amp_
    - sum_log_modal_amp_
    - top3_log_modal_amp_sum_
    - nearest_modal_weight_
    - log_modal_gain_frf
    - modal_weight_frf
    - freq_ratio_frf
  curve_frequency_feature_exclude_patterns:
    - x_norm
    - y_norm
    - z_norm
    - r_norm
    - dist_to_
    - ear_local_
    - near_
    - mask
    - weighted_
    - nearest_abs_
    - nearest_umag
    - nearest_gap
    - nearest_weight
    - active1_abs_
    - active2_abs_
    - active3_abs_
    - active1_umag
    - active2_umag
    - active3_umag
    - active1_grad_
    - active2_grad_
    - active3_grad_
    - shape_rms
    - modal_baseline_log_
  curve_node_feature_patterns:
    - _norm
    - dist_to_
    - sin_theta
    - cos_theta
    - ear_local_
    - near_ear_
    - near_hole_
    - root
    - bridge
    - center_couple
    - hole_center
    - stress_region
    - weighted_abs_
    - weighted_umag
    - nearest_abs_
    - nearest_umag
    - weighted_grad_
    - nearest_grad_
    - active1_abs_
    - active2_abs_
    - active3_abs_
    - active1_umag
    - active2_umag
    - active3_umag
    - active1_grad_
    - active2_grad_
    - active3_grad_
    - modal_baseline_log_
    - shape_rms
    - mask

training:
  init_checkpoint: node/outputs/node_mlp_v6_earpiece_allpoints/best.pt
  allow_partial_init_checkpoint: true
  save_dir: node/outputs/node_mlp_v6_earpiece_low_rank_curves_fast_eval_yolo
  epochs: 100
  lr: 0.00008
  batch_size: 4194304
  sample_batch_size: 128
  num_workers: 24
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  eval_topk_mode: selection
  eval_include_region_metrics: false
  test_on_best: false
  final_test_after_training: true
  final_test_topk_mode: full
  final_test_include_region_metrics: true
  write_diagnostics: false
  eval_progress_every_steps: 30
  progress_every_steps: 30

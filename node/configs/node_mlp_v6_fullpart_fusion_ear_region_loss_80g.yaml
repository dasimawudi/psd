    mode: weighted_sum
    name: composite_v6_fullpart_fusion_ear_region_loss_80g
    components:
      fullpart_stress_miss25_rate: 0.18
      fullpart_stress_top1_miss25_rate: 0.15
      fullpart_stress_top5_miss25_rate: 0.18
      disk_center_stress_top1_miss25_rate: 0.22
      disk_center_stress_top5_miss25_rate: 0.18
      earpiece_region_stress_miss25_rate: 0.25
      earpiece_region_stress_top1_miss25_rate: 0.55
      earpiece_region_stress_top5_miss25_rate: 0.35
      earpiece_region_stress_top1_log_mae: 0.12
      earpiece_stress_log_mae: 0.10
  save_dir: node/outputs/node_mlp_v6_fullpart_fusion_ear_region_loss_80g

base_config: node_mlp_v6_fullpart_fusion_low_rank_80g.yaml

loss:
  earpiece_region_point_weight: 2.0
  earpiece_region_top_quantile: 0.95
  earpiece_region_min_target: 0.0
  earpiece_top5_loss_weight: 0.25
  earpiece_top1_loss_weight: 0.45
  earpiece_top5_under_weight: 0.05
  earpiece_top1_under_weight: 0.12
  earpiece_under_margin_log: 0.09531018
  earpiece_top5_quantile: 0.95
  earpiece_top1_quantile: 0.99
  earpiece_min_points: 1
  earpiece_min_target: 0.0

scaler:

base_config: node_mlp_v6_disk_center_baseline.yaml

features:
  include_plate_hole_features: false
  include_angular_periodic_features: false
  include_node_region_masks: false
  include_stress_region_distance_features: false
  use_mode_shapes: false
  include_shape_normalized_mode_features: false
  include_modal_ratio_features: false
  include_modal_frf_features: false
  include_modal_frf_shape_features: false
  include_modal_gradient_features: false
  include_modal_baseline_feature: false

loss:
  participation_residual_weight: 0.0
  participation_residual_band_weight: 0.0

scaler:
  cache_path: node/cache/node_mlp_v6_disk_center_geometry_psd_only_scalers.pt

training:
  init_checkpoint: node/outputs/node_mlp_v6_fullpart_disk_center/best.pt
  save_dir: node/outputs/node_mlp_v6_disk_center_ablation_geometry_psd_only

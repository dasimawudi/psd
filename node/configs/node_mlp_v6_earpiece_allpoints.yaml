dataset:
  root: .cache/mises_psd_next1000_full_export_step0p5_balanced_v1
  sample_mode: per_frequency
  include_zero_frequency: false
  min_frequency_hz: 20.0
  max_frequency_hz: 2000.0
  split_mode: ratio
  split_seed: 42
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  node_scope: earpiece
  earpiece_region:
    enabled: true
    type: earpiece
    width_scale: 1.5

features:
  use_psd: true
  include_psd_value_at_frequency: true
  include_log_psd_value_at_frequency: true
  include_earpiece_local_features: true
  include_node_region_masks: true
  include_stress_region_distance_features: true
  earpiece_root_band: 4.0
  earpiece_bridge_tau: 2.0
  earpiece_bridge_width: 8.0
  use_mode_shapes: true
  mode_shape_columns: [U1, U2, U3, U_mag]
  mode_shape_count: 10
  mode_shape_normalization: max_umag
  include_shape_normalized_mode_features: true
  mode_shape_extra_normalizations: [rms_umag]
  mode_shape_weighting: resonance
  mode_shape_damping_ratio: 0.02
  mode_shape_modal_frequency_power: 2.0
  include_modal_ratio_features: true
  include_modal_frf_features: true
  modal_frf_damping_ratios: [0.01, 0.02, 0.05]
  modal_frf_amp_clip: 1000.0
  modal_frf_topk: 3
  include_modal_frf_shape_features: true
  modal_frf_shape_damping_ratio: 0.02
  modal_frf_shape_gain_power: 2.0
  modal_frf_shape_amp_clip: 200.0
  modal_frf_shape_gain_clip: 10000.0
  modal_frf_shape_topk: 3
  include_modal_gradient_features: true
  modal_gradient_normalization: max_umag
  modal_gradient_keys: [grad_umag_mean, grad_umag_max, grad_vector_mean, grad_vector_max]
  include_modal_baseline_feature: true
  modal_baseline_use_psd: true
  modal_baseline_keys: [grad_umag_mean, grad_umag_max, grad_vector_mean]

target:
  zero_below: "p99*1e-8"

loss:
  weighting: target_quantile
  top5_weight: 4.0
  top1_weight: 12.0
  target_bucket_weights:
    - {min: 0.0, max: 1.0, weight: 1.35}
    - {min: 1.0, max: 10.0, weight: 1.20}
    - {min: 10.0, max: 100.0, weight: 1.10}
  low_target_overprediction_weight: 0.05
  low_target_overprediction_min: 0.0
  low_target_overprediction_max: 100.0
  sample_peak_loss_weight: 0.20
  sample_top5_loss_weight: 0.15
  sample_top1_loss_weight: 0.25
  sample_mean_loss_weight: 0.05
  sample_top5_quantile: 0.95
  sample_top1_quantile: 0.99
  background_false_peak_weight: 0.006
  background_false_peak_min_rank_fraction: 0.50
  background_false_peak_margin_log: 0.40546511
  participation_residual_weight: 0.15
  participation_baseline: mean_log
  participation_residual_band_weight: 0.15
  participation_residual_rank_bands:
    - {left: 0.00, right: 0.01, weight: 1.0}
    - {left: 0.01, right: 0.05, weight: 1.0}
    - {left: 0.05, right: 0.10, weight: 1.0}
    - {left: 0.10, right: 0.25, weight: 1.0}
    - {left: 0.25, right: 0.50, weight: 1.0}
    - {left: 0.50, right: 1.00, weight: 1.1}

scaler:
  num_workers: 8
  sample_seed: 42
  prefetch_factor: 3
  cache_path: node/cache/node_mlp_v5_exp_region_distance_within25_short_scalers.pt
  target_stats_cache_path: node/cache/node_mlp_earpiece_case1000_v5_modal_gradient_baseline_80g_scalers.pt
  overwrite_cache: false
  reuse_target_stats_from_cache: true
  target_stats_max_values: 2000000

model:
  hidden_dims: [256, 256, 128]
  activation: silu
  dropout: 0.10
  layer_norm: true

training:
  seed: 42
  device: auto
  epochs: 30
  lr: 0.00008
  weight_decay: 0.0001
  grad_clip: 1.0
  batch_size: 1048576
  sample_batch_size: 64
  num_workers: 8
  shuffle_samples: false
  eval_every: 1
  eval_progress_every_steps: 30
  write_diagnostics: false
  early_stopping_patience: 6
  progress_every_steps: 30
  init_checkpoint: node/outputs/node_mlp_v5_exp_region_distance_within25_short/best.pt
  allow_partial_init_checkpoint: false
  selection_metric: composite_v6_earpiece
  selection:
    mode: weighted_sum
    name: composite_v6_earpiece
    components:
      earpiece_stress_log_mae: 0.80
      earpiece_stress_miss25_rate: 0.80
      earpiece_stress_peak_relative_error: 0.12
      earpiece_stress_top5_log_mae: 0.18
      earpiece_stress_top1_log_mae: 0.12
  save_dir: node/outputs/node_mlp_v6_earpiece_allpoints

features:
  use_psd: true
  include_psd_value_at_frequency: true
  include_log_psd_value_at_frequency: true
  include_earpiece_local_features: false
  include_disk_center_features: true
  include_plate_hole_features: true
  include_angular_periodic_features: true
  include_node_region_masks: true
  include_stress_region_distance_features: true
  center_region_tau: 8.0
  center_couple_sigmoid_gain: 5.0
  plate_hole_wall_tau: 2.0
  use_mode_shapes: true
  mode_shape_columns:
  - U1
  - U2
  - U3
  - U_mag
  mode_shape_count: 10
  mode_shape_normalization: max_umag
  include_shape_normalized_mode_features: true
  mode_shape_extra_normalizations:
  - rms_umag
  mode_shape_weighting: resonance
  mode_shape_damping_ratio: 0.02
  mode_shape_modal_frequency_power: 2.0
  include_modal_ratio_features: true
  include_modal_frf_features: true
  modal_frf_damping_ratios:
  - 0.01
  - 0.02
  - 0.05
  modal_frf_amp_clip: 1000.0
  modal_frf_topk: 3
  include_modal_frf_shape_features: true
  modal_frf_shape_damping_ratio: 0.02
  modal_frf_shape_gain_power: 2.0
  modal_frf_shape_amp_clip: 200.0
  modal_frf_shape_gain_clip: 10000.0
  modal_frf_shape_topk: 3
  include_modal_gradient_features: true
  modal_gradient_normalization: max_umag
  modal_gradient_keys:
  - grad_umag_mean
  - grad_umag_max
  - grad_vector_mean
  - grad_vector_max
  include_modal_baseline_feature: true
  modal_baseline_use_psd: true
  modal_baseline_keys:
  - grad_umag_mean
  - grad_umag_max
  - grad_vector_mean
target:
  zero_below: p99*1e-8
loss:
  weighting: target_quantile
  top5_weight: 4.0
  top1_weight: 12.0
  target_bucket_weights:
  - min: 0.0
    max: 1.0
    weight: 1.35
  - min: 1.0
    max: 10.0
    weight: 1.2
  - min: 10.0
    max: 100.0
    weight: 1.1
  low_target_overprediction_weight: 0.05
  low_target_overprediction_min: 0.0
  low_target_overprediction_max: 100.0
  sample_peak_loss_weight: 0.25
  sample_top5_loss_weight: 0.2
  sample_top1_loss_weight: 0.35
  sample_mean_loss_weight: 0.05
  sample_top5_quantile: 0.95
  sample_top1_quantile: 0.99
  background_false_peak_weight: 0.004
  background_false_peak_min_rank_fraction: 0.5
  background_false_peak_margin_log: 0.40546511
  participation_residual_weight: 0.15
  participation_baseline: mean_log
  participation_residual_band_weight: 0.15
  participation_residual_rank_bands:
  - left: 0.0
    right: 0.01
    weight: 1.0
  - left: 0.01
    right: 0.05
    weight: 1.0
  - left: 0.05
    right: 0.1
    weight: 1.0
  - left: 0.1
    right: 0.25
    weight: 1.0
  - left: 0.25
    right: 0.5
    weight: 1.0
  - left: 0.5
    right: 1.0
    weight: 1.1
scaler:
  num_workers: 16
  sample_seed: 42
  prefetch_factor: 2
  cache_path: node/cache/node_mlp_v6_disk_center_baseline_scalers.pt
  overwrite_cache: true
  reuse_target_stats_from_cache: true
  target_stats_max_values: 2000000
model:
  hidden_dims:
  - 256
  - 256
  - 128
  activation: silu
  dropout: 0.1
  layer_norm: true
training:
  seed: 42
  device: auto
  epochs: 30
  lr: 8.0e-05
  weight_decay: 0.0001
  grad_clip: 1.0
  batch_size: 1048576
  sample_batch_size: 64
  num_workers: 16
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true
  cache_prepared_samples: false
  shuffle_samples: false
  eval_every: 1
  eval_progress_every_steps: 30
  write_diagnostics: false
  early_stopping_patience: 6
  progress_every_steps: 30
  init_checkpoint: node/outputs/node_mlp_v6_fullpart_disk_center/best.pt
  allow_partial_init_checkpoint: true
  selection_metric: composite_v6_disk_center
  selection:
    mode: weighted_sum
    name: composite_v6_disk_center
    components:
      earpiece_stress_log_mae: 0.8
      earpiece_stress_miss25_rate: 0.8
      earpiece_stress_peak_relative_error: 0.15
      earpiece_stress_top5_log_mae: 0.2
      earpiece_stress_top1_log_mae: 0.15
  save_dir: node/outputs/node_mlp_v6_disk_center_baseline
